packages:
  - packages/*
catalogMode: prefer
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^26.6.6
  bingo: ^0.17.0
  publint: ^0.3.25
  tsrs: 7.1.0-beta.tsrs2
  zod: ^4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  bingo-stratum: 0.11.1
  dependency-cruiser: ^18.8.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
