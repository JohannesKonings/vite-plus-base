minimumReleaseAge: 2880
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@jaykingson/vite-plus-base"
packages:
  - packages/*
catalogMode: prefer
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  # 0.1.6 (2026-10-10) is inside minimumReleaseAge. ^0.1.5 selects 0.1.5 until 0.1.6 is old enough.
  "@oxc-node/cli": ^0.1.5
  "@oxc-node/core": ^0.1.5
  "@types/node": ^24
  "@vitejs/plugin-react": ^6.1.2
  bingo: ^0.9.3
  oxc-transform-react: ^0.152.0
  publint: ^0.3.25
  typescript: ^7.0.2
  zod: ^3.25.76
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  bingo-stratum: 0.7.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
