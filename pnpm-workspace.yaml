minimumReleaseAge: 2880
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@jaykingson/vite-plus-base"

packages:
  - packages/*
catalogMode: prefer
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^24
  bingo: ^0.9.3
  publint: ^0.3.25
  typescript: ^7.0.2
  zod: ^3.25.76
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  bingo-stratum: 0.8.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
